name: CI

on:
  pull_request:
  push:
    branches: [main]

# Deliberately no `paths:` filter. This check is meant to be a required status
# check, and a required check that is skipped by a path filter leaves pull
# requests permanently unmergeable rather than passing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      # Run the gates as separate steps rather than via `npm run verify`, so a
      # failure names which gate broke without anyone opening the log.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
